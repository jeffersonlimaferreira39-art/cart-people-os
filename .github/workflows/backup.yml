name: Backup

# Backup diário criptografado do banco e dos arquivos (ver docs/BACKUP.md).
on:
  schedule:
    - cron: "17 5 * * *" # 02:17 em Fortaleza/São Paulo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Cópia externa no Cloudflare R2 (compatível com S3)
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Conferir segredos
        run: |
          missing=""
          for v in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SECRET_KEY BACKUP_PASSPHRASE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cadastre os segredos do repositório:$missing (docs/BACKUP.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Instalar cliente PostgreSQL 17 (mesma versão do Supabase)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Gerar backup criptografado
        run: OUT_DIR=backup-out bash scripts/backup/backup.sh
      - name: Testar se o arquivo abre com a senha
        run: |
          f=$(ls backup-out/*.enc)
          bash scripts/backup/decrypt.sh "$f" /tmp/verify >/dev/null
          test -s /tmp/verify/*/data.sql && echo "✓ backup legível"
          rm -rf /tmp/verify
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-out/
          retention-days: 30
          if-no-files-found: error
      - name: Enviar para o Cloudflare R2
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Cadastre os segredos R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID e R2_SECRET_ACCESS_KEY (docs/BACKUP.md)"
            exit 1
          fi
          # Aceita o Account ID puro ou o endpoint completo (https://<id>.r2.cloudflarestorage.com).
          account=$(printf '%s' "$R2_ACCOUNT_ID" | grep -oiE '[0-9a-f]{32}' | head -1)
          [ -n "$account" ] || { echo "::error::R2_ACCOUNT_ID inválido: use o código de 32 caracteres do Account ID"; exit 1; }
          R2_BUCKET=$(printf '%s' "$R2_BUCKET" | tr -d '[:space:]/')
          endpoint="https://${account}.r2.cloudflarestorage.com"
          day=$(date -u +%Y/%m)
          for f in backup-out/*; do
            aws s3 cp "$f" "s3://${R2_BUCKET}/backups/${day}/$(basename "$f")" --endpoint-url "$endpoint" --only-show-errors
          done
          # Confere: o arquivo no R2 tem o mesmo tamanho do gerado aqui.
          enc=$(ls backup-out/*.enc)
          remote=$(aws s3api head-object --bucket "$R2_BUCKET" --key "backups/${day}/$(basename "$enc")" --endpoint-url "$endpoint" --query ContentLength --output text)
          test "$remote" = "$(stat -c %s "$enc")"
          echo "✓ Enviado para r2://${R2_BUCKET}/backups/${day}/ ($remote bytes)"
